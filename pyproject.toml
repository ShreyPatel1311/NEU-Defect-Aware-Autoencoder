[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defect-aware-mae"
version = "1.0.0"
description = "Defect-aware masked autoencoder for label-free steel-surface defect clustering"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shrey Patel" }]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "numpy", "scipy", "scikit-learn>=1.4", "umap-learn>=0.5.5", "opencv-python-headless>=4.9",
  "grad-cam>=1.5", "matplotlib", "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "nbconvert", "pandas"]

[project.scripts]
damae-train = "defect_aware_mae.train:main"
damae-eval = "defect_aware_mae.evaluate:main"
damae-gradcam = "defect_aware_mae.gradcam:main"

[tool.setuptools.packages.find]
where = ["src"]
